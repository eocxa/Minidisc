<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AMLL Engine</title>
  <link rel="stylesheet" href="amll.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      color: #ffffff;
    }
    #lyrics-viewport {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent !important;
    }
    #lyrics-viewport .amll-lyric-player {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      --amll-lp-font-size: clamp(34px, 4.8vw, 48px);
      --amll-lp-line-padding-x: clamp(20px, 3.5vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .amll-lyric-player .FmKaba_lyricMainLine {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="lyrics-viewport"></div>

  <script src="amll-bundle.iife.js"></script>
  <script>
    (function() {
      const container = document.getElementById('lyrics-viewport');
      let player = null;
      let lastFrameTime = performance.now();
      let isPlayingAudio = false;

      // 1. Inicializar el motor oficial LyricPlayer de AMLL
      try {
        if (window.AMLLCore && window.AMLLCore.LyricPlayer) {
          player = new window.AMLLCore.LyricPlayer();
          player.getElement().classList.add('dom');
          container.appendChild(player.getElement());

          // Posicionamiento superior: verso actual arriba mostrando solo el último renglón del verso previo
          player.setAlignAnchor('top');
          player.setAlignPosition(0.14);
          player.setEnableBlur(true);
          player.setAlwaysPostpositionBackground(false);

          // Escuchar clics interactivos en cualquier verso para saltar en Minidisc
          player.addEventListener('line-click', function(e) {
            try {
              let targetSec = null;
              if (e.line && typeof e.line.getLine === 'function') {
                targetSec = e.line.getLine().startTime / 1000;
              } else {
                const lines = player.getLyricLines();
                if (lines && lines[e.lineIndex]) {
                  targetSec = lines[e.lineIndex].startTime / 1000;
                }
              }
              if (targetSec != null && Number.isFinite(targetSec)) {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.onSeek) {
                  window.webkit.messageHandlers.onSeek.postMessage(targetSec);
                }
              }
            } catch (err) {
              console.warn('[AMLL] Error en line-click:', err);
            }
          });
          console.log('[AMLL] LyricPlayer inicializado exitosamente');
        } else {
          console.error('[AMLL] No se encontró window.AMLLCore.LyricPlayer');
        }
      } catch (e) {
        console.error('[AMLL] Excepción inicializando:', e);
      }

      // Desactivar foco y persistencia de hover al soltar el dedo en pantallas táctiles
      document.addEventListener('touchend', function() {
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
      }, { passive: true });
      document.addEventListener('touchcancel', function() {
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
      }, { passive: true });

      // Calibración de anclaje de altura para mantener verso constante con o sin controles
      let isControlsHidden = false;
      let controlsVisibleHeight = 0;

      function updateAlignment() {
        if (!player || !container) return;
        const h = container.clientHeight || window.innerHeight;
        if (!h || h <= 0) return;

        if (!isControlsHidden) {
          controlsVisibleHeight = h;
          player.setAlignPosition(0.14);
        } else {
          const baseH = (controlsVisibleHeight > 0) ? controlsVisibleHeight : Math.max(100, h - 270);
          const targetPx = baseH * 0.14;
          const ratio = Math.max(0.01, Math.min(0.20, targetPx / h));
          player.setAlignPosition(ratio);
        }
        if (typeof player.calcLayout === 'function') {
          player.calcLayout('config-change');
        }
      }

      window.amllSetControlsHidden = function(hidden) {
        isControlsHidden = !!hidden;
        updateAlignment();
      };

      window.addEventListener('resize', function() {
        updateAlignment();
      });

      function updateAdlibsVisibility() {
        if (!player || !player.currentLyricGroups) return;
        const curTime = player.getCurrentTime();
        const isTouchScrolled = !!(player.scrollState && player.scrollState.isTouchScrolled);

        for (let i = 0; i < player.currentLyricGroups.length; i++) {
          const group = player.currentLyricGroups[i];
          if (!group || !group.bgWrapper) continue;

          let bgEndTime = 0;
          try {
            if (group.bgLine) {
              const bgLineData = group.bgLine.getLine();
              if (bgLineData) {
                const words = bgLineData.words;
                bgEndTime = (words && words.length > 0) ? words[words.length - 1].endTime : (bgLineData.endTime || 0);
              }
            }
          } catch (_) {}

          const shouldShow = group.isActive && !isTouchScrolled && (bgEndTime > 0 ? (curTime <= bgEndTime + 150) : true);

          if (shouldShow) {
            if (!group.bgWrapper.classList.contains('amll-adlib-active')) {
              group.bgWrapper.classList.add('amll-adlib-active');
              group.bgWrapper.classList.remove('amll-adlib-hidden');
            }
            group.bgWrapper.style.opacity = '0.85';
            group.bgWrapper.style.visibility = 'visible';
            group.bgWrapper.style.pointerEvents = 'auto';
            group.bgWrapper.style.display = 'flex';
            group.bgWrapper.style.position = 'relative';
            group.bgWrapper.style.maxHeight = '120px';
            group.bgWrapper.style.height = 'auto';
          } else {
            if (!group.bgWrapper.classList.contains('amll-adlib-hidden')) {
              group.bgWrapper.classList.remove('amll-adlib-active');
              group.bgWrapper.classList.add('amll-adlib-hidden');
            }
            group.bgWrapper.style.opacity = '0';
            group.bgWrapper.style.visibility = 'hidden';
            group.bgWrapper.style.pointerEvents = 'none';
            group.bgWrapper.style.display = 'none';
            group.bgWrapper.style.position = 'absolute';
            group.bgWrapper.style.maxHeight = '0px';
            group.bgWrapper.style.height = '0px';
            group.bgWrapper.style.margin = '0px';
            group.bgWrapper.style.padding = '0px';
          }
        }
      }

      function updateBottomCredits() {
        if (!player || typeof player.getBottomLineElement !== 'function') return;
        const bottomEl = player.getBottomLineElement();
        if (!bottomEl || !bottomEl.innerHTML) return;

        const lines = player.getLyricLines();
        const curTime = player.getCurrentTime();
        const isTouchScrolled = !!(player.scrollState && player.scrollState.isTouchScrolled);

        const lastLine = (lines && lines.length > 0) ? lines[lines.length - 1] : null;
        const isNearEnd = lastLine ? (curTime >= (lastLine.startTime - 2500)) : false;

        const blurRadius = (isTouchScrolled || isNearEnd) ? 0 : 5.0;
        bottomEl.style.filter = blurRadius > 0 ? ('blur(' + blurRadius + 'px)') : 'none';
        bottomEl.style.opacity = (isTouchScrolled || isNearEnd) ? '0.85' : '0.45';
      }

      // 2. Bucle continuo de renderizado a 60 / 120 FPS (Física de resortes y shaders)
      function animLoop(now) {
        const delta = now - lastFrameTime;
        lastFrameTime = now;
        if (player) {
          player.update(delta);
          updateAdlibsVisibility();
          updateBottomCredits();
        }
        requestAnimationFrame(animLoop);
      }
      requestAnimationFrame(animLoop);

      // Convertidores auxiliares para estructuras nativas de Minidisc
      function convertNowLocalToAMLL(lyrics) {
        if (!Array.isArray(lyrics)) return [];
        const result = [];
        for (let i = 0; i < lyrics.length; i++) {
          const l = lyrics[i];
          if (l.text === '…' || l.text === '...') continue;

          const isLast = (i === lyrics.length - 1);
          const isV2 = l.agent === 'v2';
          const mainWords = (l.main && l.main.words && l.main.words.length > 0) ? l.main.words : (l.words && l.words.length > 0 ? l.words : null);
          const nextTime = (i + 1 < lyrics.length) ? lyrics[i + 1].time : (l.time + 3.0);

          let maxMainWordEnd = 0;
          if (mainWords && mainWords.length > 0) {
            for (let w of mainWords) {
              const we = w.endTime != null ? w.endTime : (w.time + 0.35);
              if (we > maxMainWordEnd) maxMainWordEnd = we;
            }
          }
          let mainEndTime = (l.endTime != null && l.endTime > l.time) ? l.endTime : ((maxMainWordEnd > l.time) ? maxMainWordEnd : nextTime);
          if (maxMainWordEnd > mainEndTime) mainEndTime = maxMainWordEnd;
          if (isLast) {
            // El último verso debe permanecer iluminado hasta que termine la canción, o sea que no debe subir
            mainEndTime = Math.max(mainEndTime, l.time + 3600.0);
          }

          let words = [];
          if (mainWords && mainWords.length > 0) {
            words = mainWords.map(w => ({
              word: w.text,
              startTime: Math.round(w.time * 1000),
              endTime: Math.round((w.endTime != null ? w.endTime : (w.time + 0.35)) * 1000)
            }));
          } else {
            const lineText = (l.main && l.main.text) || l.text || '';
            words = [{
              word: lineText,
              startTime: Math.round(l.time * 1000),
              endTime: Math.round(mainEndTime * 1000)
            }];
          }

          result.push({
            words: words,
            startTime: Math.round(l.time * 1000),
            endTime: Math.round(mainEndTime * 1000),
            isDuet: isV2,
            isBG: false
          });

          const hasAdlib = (l.has_adlib === true || l.hasAdlib === true || !!l.adlib);
          if (hasAdlib && l.adlib) {
            const adlibWords = (l.adlib.words && l.adlib.words.length > 0) ? l.adlib.words : null;
            const isAdlibBefore = (l.adlib_is_before !== undefined) ? !!l.adlib_is_before : ((l.adlibIsBefore !== undefined) ? !!l.adlibIsBefore : ((l.adlib.time != null && l.time != null) ? (l.adlib.time < l.time) : false));

            let adStart = (l.adlib.time != null ? l.adlib.time : l.time);
            if (isAdlibBefore && adStart >= l.time) {
              adStart = Math.max(0, l.time - 0.05);
            } else if (!isAdlibBefore && adStart <= l.time) {
              adStart = l.time + 0.05;
            }

            let maxAdWordEnd = 0;
            if (adlibWords && adlibWords.length > 0) {
              for (let w of adlibWords) {
                const we = w.endTime != null ? w.endTime : (w.time + 0.35);
                if (we > maxAdWordEnd) maxAdWordEnd = we;
              }
            }
            let adEnd = (l.adlib.endTime != null && l.adlib.endTime > adStart) ? l.adlib.endTime : ((maxAdWordEnd > adStart) ? maxAdWordEnd : mainEndTime);
            if (maxAdWordEnd > adEnd) adEnd = maxAdWordEnd;

            let adWords = [];
            if (adlibWords && adlibWords.length > 0) {
              adWords = adlibWords.map(w => ({
                word: w.text,
                startTime: Math.round(w.time * 1000),
                endTime: Math.round((w.endTime != null ? w.endTime : (w.time + 0.35)) * 1000)
              }));
            } else {
              adWords = [{
                word: l.adlib.text || '',
                startTime: Math.round(adStart * 1000),
                endTime: Math.round(adEnd * 1000)
              }];
            }

            result.push({
              words: adWords,
              startTime: Math.round(adStart * 1000),
              endTime: Math.round(adEnd * 1000),
              isDuet: isV2,
              isBG: true
            });
          }
        }
        return result;
      }

      function convertStructuredLinesToAMLL(lines) {
        if (!Array.isArray(lines)) return [];
        const result = [];
        for (let i = 0; i < lines.length; i++) {
          const l = lines[i];
          const startMs = l.start != null ? l.start : 0;
          const nextStartMs = (i + 1 < lines.length && lines[i + 1].start != null) ? lines[i + 1].start : (startMs + 3000);
          result.push({
            words: [{
              word: l.value || '',
              startTime: startMs,
              endTime: nextStartMs
            }],
            startTime: startMs,
            endTime: nextStartMs,
            isDuet: false,
            isBG: false
          });
        }
        return result;
      }

      // 3. API Global expuesta a Swift / WKWebView
      window.amllSetTime = function(timeMs, isPlaying, forceSeek) {
        if (!player) return;
        isPlayingAudio = !!isPlaying;
        player.setCurrentTime(timeMs, !!forceSeek);
        if (isPlayingAudio) {
          player.resume();
        } else {
          player.pause();
        }
      };

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
        });
      }

      window.amllLoadLyrics = function(content, format) {
        if (!player || !content) return;
        try {
          let lines = [];
          let composer = '';
          const fmt = (format || 'auto').toLowerCase();

          if (fmt === 'nowlocal' || (typeof content === 'object' && Array.isArray(content.lyrics))) {
            const raw = typeof content === 'string' ? JSON.parse(content) : content;
            if (raw.composer && typeof raw.composer === 'string') {
              composer = raw.composer.replace(/[\r\n]+/g, ', ').replace(/\s{2,}/g, ' ').trim();
            }
            if (Array.isArray(raw.lyrics) && raw.lyrics.length > 0) {
              lines = convertNowLocalToAMLL(raw.lyrics);
            } else if (raw.raw_ttml && window.AMLLLyric && window.AMLLLyric.parseTTML) {
              const parsed = window.AMLLLyric.parseTTML(raw.raw_ttml);
              lines = parsed.lines || [];
              if (!composer && parsed && parsed.metadata && Array.isArray(parsed.metadata.songwriters) && parsed.metadata.songwriters.length > 0) {
                composer = parsed.metadata.songwriters.join(', ');
              }
            } else if (raw.raw_lrc && window.AMLLLyric && window.AMLLLyric.parseLrc) {
              lines = window.AMLLLyric.parseLrc(raw.raw_lrc) || [];
            }
          } else if (fmt === 'ttml' || (fmt === 'auto' && typeof content === 'string' && content.includes('<tt'))) {
            if (window.AMLLLyric && window.AMLLLyric.parseTTML) {
              const parsed = window.AMLLLyric.parseTTML(content);
              lines = parsed.lines || [];
              if (!composer && parsed && parsed.metadata && Array.isArray(parsed.metadata.songwriters) && parsed.metadata.songwriters.length > 0) {
                composer = parsed.metadata.songwriters.join(', ');
              }
            }
          } else if (fmt === 'lrc' || (fmt === 'auto' && typeof content === 'string' && content.includes('['))) {
            if (window.AMLLLyric && window.AMLLLyric.parseLrc) {
              lines = window.AMLLLyric.parseLrc(content) || [];
            }
          } else if (fmt === 'structured') {
            const rawLines = typeof content === 'string' ? JSON.parse(content) : content;
            lines = convertStructuredLinesToAMLL(rawLines);
          } else if (fmt === 'json' || Array.isArray(content)) {
            lines = typeof content === 'string' ? JSON.parse(content) : content;
          }

          if (Array.isArray(lines) && lines.length > 0) {
            // Requisito: Cuando termina el último verso, ese último debe permanecer iluminado
            // hasta que termine la canción, o sea que no debe subir ni perder iluminación.
            for (let k = lines.length - 1; k >= 0; k--) {
              if (!lines[k].isBG) {
                const sTime = lines[k].startTime || 0;
                lines[k].endTime = Math.max(lines[k].endTime || 0, sTime + 3600000);
                break;
              }
            }

            player.setLyricLines(lines);

            // Mostrar compositores hasta abajo (Referencia Commit 0b58c73)
            if (typeof player.getBottomLineElement === 'function') {
              const bottomEl = player.getBottomLineElement();
              if (bottomEl) {
                if (composer.length > 0) {
                  bottomEl.innerHTML = '<div class="amll-composer-container"><span class="amll-composer-label">Written by:</span> <span class="amll-composer-names">' + escapeHtml(composer) + '</span></div>';
                } else {
                  bottomEl.innerHTML = '';
                }
              }
            }
            console.log('[AMLL] Letras cargadas:', lines.length, 'líneas, compositores:', composer);
          } else {
            console.warn('[AMLL] No se obtuvieron líneas válidas.');
          }
        } catch (err) {
          console.error('[AMLL] Error parseando letras:', err);
        }
      };

      window.amllSetFontSize = function(sizePx) {
        if (!container) return;
        container.style.setProperty('--amll-lp-font-size', sizePx + 'px');
      };

      window.amllClear = function() {
        if (player) {
          player.setLyricLines([]);
          if (typeof player.getBottomLineElement === 'function') {
            const bottomEl = player.getBottomLineElement();
            if (bottomEl) bottomEl.innerHTML = '';
          }
        }
      };

      // Notificar a Swift que el motor web está listo
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.onReady) {
        window.webkit.messageHandlers.onReady.postMessage('ready');
      }
    })();
  </script>
</body>
</html>
