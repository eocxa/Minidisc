name: Build Minidisc IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          echo "Installed Xcode versions on runner:"
          ls -d /Applications/Xcode*
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          else
            echo "Falling back to latest Xcode available"
            LATEST_ANY=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            sudo xcode-select -s "$LATEST_ANY"
          fi
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project Minidisc.xcodeproj -scheme Minidisc

      - name: Build Archive (Unsigned for Sideloading)
        run: |
          set -o pipefail
          xcodebuild \
            -project Minidisc.xcodeproj \
            -scheme Minidisc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Minidisc.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log || {
              echo "::error::=== BUILD FAILED ==="
              grep -E "(: error:|fatal error:)" build.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Minidisc.xcarchive/Products/Applications/Minidisc.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Minidisc.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Minidisc.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minidisc-iOS-IPA
          path: Minidisc.ipa
          retention-days: 30
